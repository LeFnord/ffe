default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: ffe_development

test:
  <<: *default
  database: ffe_test

production:
  <<: *default
  database: ffe_production
  username: ffe
  password: <%= ENV["FFE_DATABASE_PASSWORD"] %>
